name: Preview

# Every pull request gets its own docs and Storybook workers on workers.dev;
# preview-cleanup.yml deletes them when it closes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Forks cannot read the Cloudflare secrets; skip rather than fail red.
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: storybook.ui.voila.dev
            worker: storybook-ui-voila-dev
            label: Storybook
          - app: ui.voila.dev
            worker: ui-voila-dev
            label: Docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and deploy the preview worker
        id: deploy
        uses: ./.github/actions/deploy-site
        with:
          app: ${{ matrix.app }}
          worker-name: ${{ matrix.worker }}-pr-${{ github.event.pull_request.number }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post the preview link
        uses: voila-voila-dev/.github/actions/sticky-pr-comment@81236edbf9d9298d770ddaeb6df370f0c5f87778 # main
        with:
          id: ${{ matrix.app }}_preview
          body: |
            **${{ matrix.label }} preview** :rocket:

            ${{ steps.deploy.outputs.url }}

            Deployed from `${{ github.event.pull_request.head.sha }}`.
